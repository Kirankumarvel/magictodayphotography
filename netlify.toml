# Serve robots.txt and sitemap.xml similarly
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  headers = {Content-Type = "text/plain"}

# Serve sitemap.xml directly
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  headers = {Content-Type = "application/xml"}

# Serve llms.txt as plain text
[[redirects]]
  from = "/llms.txt"
  to = "/llms.txt"
  status = 200
  headers = {Content-Type = "text/plain"}
  
  

# Catch-all rule for your SPA (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

  
  
# Redirect old .html pages to clean URLs
[[redirects]]
  from = "/wedding-photographer-bangalore.html"
  to = "/wedding-photographer-bangalore"
  status = 301

[[redirects]]
  from = "/.well-known/ai-plugin.json"
  to = "/.well-known/ai-plugin.json"
  status = 200
  headers = {Content-Type = "application/json"}

[[redirects]]
  from = "/openapi.yaml"
  to = "/openapi.yaml"
  status = 200
  headers = {Content-Type = "text/yaml"}
