# Serve robots.txt directly
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# Serve sitemap.xml directly
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# Serve llms.txt directly
[[redirects]]
  from = "/llms.txt"
  to = "/llms.txt"
  status = 200

# Catch-all rule for your SPA (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  
# Redirect old .html pages to clean URLs
[[redirects]]
  from = "/wedding-photographer-bangalore.html"
  to = "/wedding-photographer-bangalore"
  status = 301
