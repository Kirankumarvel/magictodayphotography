# Serve robots.txt as plain text
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  headers = {Content-Type = "text/plain"}

# Serve sitemap.xml as XML
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  headers = {Content-Type = "application/xml"}

# Serve llms.txt as plain text
[[redirects]]
  from = "/llms.txt"
  to = "/llms.txt"
  status = 200
  headers = {Content-Type = "text/plain"}

# Allow extensionless URLs for top-level static pages
[[redirects]]
  from = "/:page"
  to = "/:page.html"
  status = 200

# SPA catch-all rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Redirect old html to clean URL (you can generalize this per above)
[[redirects]]
  from = "/wedding-photographer-bangalore.html"
  to = "/wedding-photographer-bangalore"
  status = 301

# AI plugin JSON
[[redirects]]
  from = "/.well-known/ai-plugin.json"
  to = "/.well-known/ai-plugin.json"
  status = 200
  headers = {Content-Type = "application/json"}

# OpenAPI yaml
[[redirects]]
  from = "/openapi.yaml"
  to = "/openapi.yaml"
  status = 200
  headers = {Content-Type = "text/yaml"}
